<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Mouse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #2d2a32;
            --ink-soft: #6f6878;
            --page: #f7f2e8;
            --panel: #ece4d4;
            --panel-edge: #d8cdb8;
            --board: #fdf6e3;
            --radius: 16px;
            --radius-small: 12px;
            --press-depth: 5px;
            --press-shadow: 0 var(--press-depth) 0 rgba(0, 0, 0, 0.28);
            --pressed-shadow: 0 1px 0 rgba(0, 0, 0, 0.28);
            --frame-width: 608px;
            --forward: #3498db;
            --backward: #ffdc00;
            --turn-left: #e67e22;
            --turn-right: #9b59b6;
            --squeak: #ff4136;
            --go: #2ecc40;
            --neutral: #8a8494;
            --win: #27ae60;
            --try: #e67e22;
            --font-display: "Quicksand", "Trebuchet MS", sans-serif;
        }
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            font-family: var(--font-display);
            color: var(--ink);
            background: var(--page);
            margin: 0;
        }
        button {
            font-family: inherit;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 20px 24px;
            overflow-y: auto;
        }
        .sidebar {
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 12px;
            background: var(--panel);
            border-left: 2px solid var(--panel-edge);
        }

        .top-bar {
            box-sizing: border-box;
            width: 100%;
            max-width: var(--frame-width);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }
        .title {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .mode-menu {
            position: relative;
        }
        .mode-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px 6px 16px;
            border: 3px solid var(--ink);
            border-radius: 999px;
            background: #fff;
            color: var(--ink);
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--ink);
            transition: transform 0.05s, box-shadow 0.05s;
        }
        .mode-chip:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 var(--ink);
        }
        .mode-chip:disabled {
            cursor: default;
            opacity: 0.5;
        }
        .mode-chip svg {
            width: 14px;
            height: 14px;
        }
        .mode-list {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            z-index: 10;
            width: 260px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #fff;
            border: 3px solid var(--ink);
            border-radius: var(--radius);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        }
        .mode-list[hidden] {
            display: none;
        }
        .mode-option {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            padding: 10px 12px;
            border: none;
            border-radius: var(--radius-small);
            background: transparent;
            color: var(--ink);
            text-align: left;
            cursor: pointer;
        }
        .mode-option:hover {
            background: var(--page);
        }
        .mode-option.active {
            background: var(--go);
            color: #fff;
        }
        .mode-option-name {
            font-size: 17px;
            font-weight: 600;
        }
        .mode-option-blurb {
            font-size: 13px;
            font-weight: 500;
            opacity: 0.75;
        }

        .board-frame {
            flex-shrink: 0;
            box-sizing: border-box;
            width: 100%;
            max-width: var(--frame-width);
            border: 4px solid var(--ink);
            border-radius: var(--radius);
            background: var(--board);
            overflow: hidden;
        }
        .hud {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
            height: 34px;
            padding: 0 12px;
            background: var(--ink);
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .program-stats {
            flex-shrink: 0;
            box-sizing: border-box;
            width: 278px;
            padding: 0 8px;
        }
        .stats-pill {
            position: relative;
            display: flex;
            border-radius: var(--radius-small);
            background: rgba(255, 255, 255, 0.55);
            overflow: hidden;
        }
        #progress-fill {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 0;
            background: rgba(46, 204, 64, 0.35);
        }
        .stat {
            position: relative;
            flex: 1;
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 6px 12px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .stat-label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--ink-soft);
        }
        .stat-value {
            font-size: 18px;
            font-weight: 600;
        }
        .board-stage {
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: var(--board);
        }
        #message {
            position: absolute;
            top: 14px;
            left: 50%;
            padding: 8px 18px;
            border: 3px solid var(--ink);
            border-radius: 999px;
            background: #fff;
            font-size: 20px;
            font-weight: 600;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transform: translateX(-50%) translateY(-8px);
            transition: opacity 0.3s, transform 0.3s;
        }
        #message.shown {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            animation: message-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #message.win {
            color: var(--win);
        }
        #message.try {
            color: var(--try);
        }
        @keyframes message-pop {
            0% { transform: translateX(-50%) scale(0.5); opacity: 0; }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        .icon {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: currentColor;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .controls {
            --corner-spread: 12px;
            margin-top: calc(20px + var(--corner-spread));
            display: grid;
            grid-template-columns: repeat(3, 72px);
            grid-template-rows: repeat(3, 72px);
            gap: 10px;
        }
        .control {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            border: none;
            border-radius: var(--radius);
            color: #fff;
            cursor: pointer;
            box-shadow: var(--press-shadow);
            transition: transform 0.05s, box-shadow 0.05s;
        }
        .control:active, .control.pressed {
            filter: brightness(1.15);
            transform: translateY(4px);
            box-shadow: var(--pressed-shadow);
        }
        .control:disabled {
            cursor: default;
            opacity: 0.4;
            box-shadow: 0 var(--press-depth) 0 rgba(0, 0, 0, 0.12);
        }
        .control-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .corner .icon {
            width: 24px;
            height: 24px;
        }
        #btn-forward { grid-column: 2; grid-row: 1; background: var(--forward); border-radius: 50% 50% var(--radius) var(--radius); }
        #btn-left { grid-column: 1; grid-row: 2; background: var(--turn-left); border-radius: 50% var(--radius) var(--radius) 50%; }
        #btn-go { grid-column: 2; grid-row: 2; background: var(--go); border-radius: 50%; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
        #btn-right { grid-column: 3; grid-row: 2; background: var(--turn-right); border-radius: var(--radius) 50% 50% var(--radius); }
        #btn-backward { grid-column: 2; grid-row: 3; background: var(--backward); color: var(--ink); border-radius: var(--radius) var(--radius) 50% 50%; }
        #btn-squeak { grid-column: 1; grid-row: 1; background: var(--squeak); border-radius: 50%; }
        #btn-reset { grid-column: 3; grid-row: 1; background: var(--backward); color: var(--ink); border-radius: 50%; }
        .corner {
            position: relative;
            top: calc(-1 * var(--corner-spread));
        }
        #btn-squeak { left: calc(-1 * var(--corner-spread)); }
        #btn-reset { left: var(--corner-spread); }

        .action-button {
            width: 120px;
            height: 56px;
            border: none;
            border-radius: var(--radius-small);
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fff;
            cursor: pointer;
            box-shadow: var(--press-shadow);
            transition: transform 0.05s, box-shadow 0.05s;
        }
        .action-button:active, .action-button.pressed {
            filter: brightness(1.15);
            transform: translateY(4px);
            box-shadow: var(--pressed-shadow);
        }
        .action-button:disabled {
            cursor: default;
            opacity: 0.4;
            box-shadow: 0 var(--press-depth) 0 rgba(0, 0, 0, 0.12);
        }
        #btn-delete { background: var(--squeak); }
        #btn-save { background: var(--forward); }

        #sequence-display {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-content: flex-start;
            box-sizing: border-box;
            width: 278px;
            flex: 1;
            min-height: 0;
            padding: 12px 8px;
            overflow-y: auto;
        }
        .slot {
            box-sizing: border-box;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 3px dashed #999;
            background: #ddd;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .slot .icon {
            width: 22px;
            height: 22px;
        }
        .slot.filled {
            border-style: solid;
            border-color: var(--ink);
        }
        .slot.routine {
            border-radius: var(--radius-small);
            font-size: 24px;
        }
        .slot.pop-in {
            animation: slot-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes slot-pop {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.25); opacity: 1; }
            100% { transform: scale(1); }
        }
        .slot:active {
            transform: scale(0.9);
        }
        .slot.selected {
            transform: translateY(-4px);
            box-shadow: 0 0 0 4px #fff, 0 0 0 7px #0074d9;
        }
        .slot.active {
            border-style: solid;
            border-color: var(--ink);
            box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--ink);
        }
        .tray-actions {
            flex-shrink: 0;
            margin-top: 12px;
            display: flex;
            gap: 16px;
        }
        .tray-actions.hidden {
            visibility: hidden;
        }

        #routine-row {
            margin-top: 22px;
            display: flex;
            gap: 14px;
        }
        #routine-row.hidden {
            display: none;
        }
        .routine-holder {
            position: relative;
        }
        .routine-holder.pop-in {
            animation: slot-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .routine-button {
            box-sizing: border-box;
            width: 80px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 4px;
            border: 3px solid var(--ink);
            border-radius: var(--radius);
            cursor: pointer;
            box-shadow: var(--press-shadow);
            transition: transform 0.05s, box-shadow 0.05s;
        }
        .routine-button:active, .routine-button.pressed {
            filter: brightness(1.15);
            transform: translateY(4px);
            box-shadow: var(--pressed-shadow);
        }
        .routine-button:disabled {
            cursor: default;
            opacity: 0.4;
        }
        .routine-icon {
            font-size: 30px;
            line-height: 1;
        }
        .routine-preview {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2px;
            max-height: 24px;
            overflow: hidden;
        }
        .preview-dot {
            box-sizing: border-box;
            width: 11px;
            height: 11px;
            border: 1px solid var(--ink);
            border-radius: 50%;
        }
        .routine-forget {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 26px;
            height: 26px;
            border: 2px solid #fff;
            border-radius: 50%;
            background: var(--neutral);
            color: #fff;
            font-size: 12px;
            cursor: pointer;
        }
        .routine-forget:disabled {
            visibility: hidden;
        }
        .routine-empty {
            box-sizing: border-box;
            width: 80px;
            height: 80px;
            border-radius: var(--radius);
            border: 3px dashed var(--panel-edge);
        }

        @media (max-width: 800px) {
            html, body {
                height: auto;
                min-height: 100%;
            }
            body {
                flex-direction: column;
            }
            .main-area {
                flex: none;
                padding: 10px 12px 16px;
                overflow-y: visible;
            }
            .top-bar {
                margin-bottom: 8px;
            }
            .title {
                font-size: 24px;
            }
            .mode-chip {
                font-size: 15px;
                padding: 4px 12px 4px 14px;
            }
            .hud {
                height: 30px;
                font-size: 14px;
                padding: 0 10px;
            }
            #message {
                top: 10px;
                font-size: 16px;
                padding: 6px 14px;
            }
            .sidebar {
                height: auto;
                min-height: 200px;
                padding: 12px;
                border-left: none;
                border-top: 2px solid var(--panel-edge);
            }
            .program-stats {
                width: 100%;
                max-width: 600px;
            }
            #sequence-display {
                width: 100%;
                max-width: 600px;
                flex: none;
                min-height: 112px;
                max-height: 240px;
            }
            .controls {
                margin-top: calc(16px + var(--corner-spread));
                grid-template-columns: repeat(3, 64px);
                grid-template-rows: repeat(3, 64px);
            }
            .action-button {
                width: 110px;
            }
            #routine-row {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <svg width="0" height="0" style="position: absolute">
        <defs>
            <symbol id="icon-forward" viewBox="0 0 24 24"><path d="M12 20V5M5 11.5L12 4.5l7 7"/></symbol>
            <symbol id="icon-backward" viewBox="0 0 24 24"><path d="M12 4v15M5 12.5l7 7 7-7"/></symbol>
            <symbol id="icon-turn_right" viewBox="0 0 24 24"><path d="M6 20v-8a5 5 0 0 1 5-5h8M15 3l4 4-4 4"/></symbol>
            <symbol id="icon-turn_left" viewBox="0 0 24 24"><path d="M18 20v-8a5 5 0 0 0-5-5H5M9 3L5 7l4 4"/></symbol>
            <symbol id="icon-squeak" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
            <symbol id="icon-reset" viewBox="0 0 24 24"><path d="M4 4v5h5"/><path d="M4.5 9A8 8 0 1 1 4 13"/></symbol>
            <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
        </defs>
    </svg>
    <div class="main-area">
        <header class="top-bar">
            <h1 class="title">Pseudo Mouse</h1>
            <div class="mode-menu">
                <button class="mode-chip" id="mode-chip" aria-haspopup="true" aria-expanded="false">
                    <span id="mode-chip-label">Tutorial</span>
                    <svg class="icon"><use href="#icon-chevron"/></svg>
                </button>
                <div class="mode-list" id="mode-list" hidden>
                    <button class="mode-option" data-mode="tutorial">
                        <span class="mode-option-name">Tutorial</span>
                        <span class="mode-option-blurb">Find the cheese on an open board</span>
                    </button>
                    <button class="mode-option" data-mode="puzzle">
                        <span class="mode-option-name">Puzzle</span>
                        <span class="mode-option-blurb">Walls, tunnels, bridges and belts</span>
                    </button>
                </div>
            </div>
        </header>
        <div class="board-frame">
            <div class="hud">
                <span id="level-counter"></span>
            </div>
            <div class="board-stage">
                <canvas id="game" width="600" height="440"></canvas>
                <div id="message"></div>
            </div>
        </div>
        <div class="controls">
            <button class="control" id="btn-forward" title="Step forward"><svg class="icon"><use href="#icon-forward"/></svg></button>
            <button class="control" id="btn-left" title="Turn left"><svg class="icon"><use href="#icon-turn_left"/></svg></button>
            <button class="control" id="btn-go" title="Run program">GO</button>
            <button class="control" id="btn-right" title="Turn right"><svg class="icon"><use href="#icon-turn_right"/></svg></button>
            <button class="control" id="btn-backward" title="Step backward"><svg class="icon"><use href="#icon-backward"/></svg></button>
            <button class="control corner" id="btn-squeak" title="Squeak"><svg class="icon"><use href="#icon-squeak"/></svg><span class="control-label">SQUEAK</span></button>
            <button class="control corner" id="btn-reset" title="Clear the program"><svg class="icon"><use href="#icon-reset"/></svg><span class="control-label">RESET</span></button>
        </div>
        <div id="routine-row"></div>
    </div>
    <div class="sidebar">
        <div class="program-stats">
            <div class="stats-pill">
                <div id="progress-fill"></div>
                <div class="stat"><span class="stat-label">Steps</span><span class="stat-value" id="stat-steps">0</span></div>
                <div class="stat"><span class="stat-label">Time</span><span class="stat-value" id="stat-time">0:00</span></div>
            </div>
        </div>
        <div id="sequence-display"></div>
        <div class="tray-actions" id="tray-actions">
            <button class="action-button" id="btn-delete" title="Throw away the picked steps">DELETE</button>
            <button class="action-button" id="btn-save" title="Save the picked steps as a new button">SAVE</button>
        </div>
    </div>
    <script src="board.js"></script>
    <script src="mouse.js"></script>
    <script src="maze.js"></script>
    <script src="index.js"></script>
</body>
</html>
